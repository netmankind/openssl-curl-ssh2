# =============================================================================
# GitHub Actions 示范：在云端 Ubuntu 上编译三库（纯手动触发）
#
# 触发器仅 workflow_dispatch：在 Actions 页面点 "Run workflow"，可选择 OpenSSL 版本与产物模式。
# 产物通过 upload-artifact 打包，可在该次运行页面下载。
# =============================================================================

name: Build Ubuntu

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 参与编译的 OpenSSL 版本（空格分隔）
        default: "3.5.9"
        required: true
      modes:
        description: 产物模式 static / shared，空格分隔
        default: "static"
        required: true

jobs:
  build:
    name: Ubuntu 22.04 编译
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # runner 自带 gcc/make；补装 perl 与 cmake（OpenSSL 用 perl，ssh2/curl 用 cmake）
      - name: 安装编译依赖
        run: sudo apt-get update && sudo apt-get install -y build-essential perl cmake

      # 版本/模式由手动表单输入传入；不传则脚本用默认值
      - name: 编译三库
        run: MODES="${{ inputs.modes }}" bash scripts/build-ubuntu.sh --versions "${{ inputs.versions }}"

      # 把 build/ 下产物打包成 Actions 构件，运行结束后可在网页下载
      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-22.04
          path: build/ubuntu22.04-x64/
          retention-days: 7
